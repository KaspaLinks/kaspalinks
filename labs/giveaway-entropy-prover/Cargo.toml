[workspace]
members = ["core", "host", "methods"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
blake2b_simd = { version = "1.0.4", default-features = false }
borsh = "1.8.1"
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic"] }
risc0-build = "=3.0.4"
risc0-zkvm = "=3.0.4"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
lto = true
